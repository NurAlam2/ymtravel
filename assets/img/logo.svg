<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" width="100%" height="100%">
      <defs>
        <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#fff033"/>
          <stop offset="55%" stop-color="#ffaa00"/>
          <stop offset="85%" stop-color="#e63900"/>
          <stop offset="100%" stop-color="#b31b00"/>
        </linearGradient>
        <linearGradient id="pagodaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#eb3310"/>
          <stop offset="100%" stop-color="#a81300"/>
        </linearGradient>
        <linearGradient id="blueWave" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#0b4da2"/>
          <stop offset="55%" stop-color="#0088ff"/>
          <stop offset="100%" stop-color="#004191"/>
        </linearGradient>
        <linearGradient id="orangeWave" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#d93800"/>
          <stop offset="50%" stop-color="#ff7b00"/>
          <stop offset="100%" stop-color="#ffaa00"/>
        </linearGradient>
        <linearGradient id="ymBlue" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0088e8"/>
          <stop offset="100%" stop-color="#08408a"/>
        </linearGradient>
        <linearGradient id="travelOrange" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ff8c1a"/>
          <stop offset="100%" stop-color="#d44000"/>
        </linearGradient>
      </defs>
      <!-- Sunset Sun Circle -->
      <circle cx="248" cy="158" r="78" fill="url(#sunGrad)"/>
      <!-- Sea Reflection Lines -->
      <path d="M180 205 H315 M192 213 H302 M210 221 H285" stroke="#ffcf52" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
      <!-- Birds -->
      <path d="M262 122 Q266 116 270 121 Q274 116 278 122" fill="none" stroke="#8c1d00" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M258 134 Q263 128 267 133 Q271 128 276 134" fill="none" stroke="#8c1d00" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Bonsai Tree Left -->
      <path d="M112 222 C116 208, 118 195, 114 185" stroke="#a81300" stroke-width="5.5" stroke-linecap="round" fill="none"/>
      <path d="M115 198 L102 188 M115 192 L127 184" stroke="#a81300" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="97" cy="184" rx="14" ry="6.5" fill="#c91f05"/>
      <ellipse cx="114" cy="175" rx="18" ry="7.5" fill="#d92b09"/>
      <ellipse cx="131" cy="183" rx="13" ry="6" fill="#c91f05"/>
      <!-- Red Chinese Pagoda -->
      <g fill="url(#pagodaGrad)">
        <!-- Base mound -->
        <path d="M92 228 Q115 208 140 218 L205 222 L205 234 L90 234 Z"/>
        <!-- Spire -->
        <polygon points="159,54 162,85 156,85"/>
        <!-- Tier 1 Roof -->
        <path d="M126 98 Q159 80 192 98 L182 103 L136 103 Z"/>
        <rect x="142" y="103" width="34" height="10" rx="1"/>
        <!-- Tier 2 Roof -->
        <path d="M118 122 Q159 104 200 122 L189 128 L129 128 Z"/>
        <rect x="137" y="128" width="44" height="11" rx="1"/>
        <!-- Tier 3 Roof -->
        <path d="M110 148 Q159 130 208 148 L196 155 L122 155 Z"/>
        <rect x="132" y="155" width="54" height="12" rx="1"/>
        <!-- Tier 4 Roof -->
        <path d="M103 176 Q159 158 215 176 L202 184 L116 184 Z"/>
        <rect x="128" y="184" width="62" height="14" rx="1"/>
        <!-- Tier 5 Base Roof -->
        <path d="M98 205 Q159 187 220 205 L206 213 L112 213 Z"/>
        <rect x="125" y="213" width="68" height="20" rx="1"/>
      </g>
      <!-- Pagoda Windows & Arch -->
      <g fill="#ffffff">
        <rect x="148" y="105" width="4" height="6"/><rect x="157" y="105" width="4" height="6"/><rect x="166" y="105" width="4" height="6"/>
        <rect x="145" y="130" width="4" height="7"/><rect x="153" y="130" width="4" height="7"/><rect x="161" y="130" width="4" height="7"/><rect x="169" y="130" width="4" height="7"/>
        <rect x="141" y="157" width="4" height="8"/><rect x="149" y="157" width="4" height="8"/><rect x="157" y="157" width="4" height="8"/><rect x="165" y="157" width="4" height="8"/><rect x="173" y="157" width="4" height="8"/>
        <rect x="139" y="187" width="5" height="9"/><rect x="148" y="187" width="5" height="9"/><rect x="157" y="187" width="5" height="9"/><rect x="166" y="187" width="5" height="9"/><rect x="175" y="187" width="5" height="9"/>
        <path d="M151 232 V219 Q159 214 167 219 V232 Z"/>
        <rect x="135" y="218" width="9" height="12" rx="2"/>
        <rect x="174" y="218" width="9" height="12" rx="2"/>
      </g>
      <!-- Dynamic Swoosh Waves -->
      <path d="M105 236 C215 268, 335 225, 372 135 C345 215, 235 252, 105 236 Z" fill="url(#blueWave)"/>
      <path d="M148 248 C258 272, 368 212, 384 134 C378 218, 278 265, 148 248 Z" fill="url(#orangeWave)"/>
      <path d="M172 258 C295 288, 398 225, 396 136 C412 228, 312 288, 172 258 Z" fill="url(#blueWave)"/>
      <!-- Blue & White Jet Airplane -->
      <g transform="translate(290, 58) rotate(-14)">
        <path d="M8 55 L48 45 L18 22 L8 25 Z" fill="#0066cc"/>
        <path d="M2 58 C35 44, 88 32, 118 34 C124 35, 126 39, 120 43 C92 54, 38 62, 2 58 Z" fill="#ffffff" stroke="#08408a" stroke-width="2"/>
        <path d="M8 56 C38 48, 85 38, 116 37" stroke="#0077e6" stroke-width="3" fill="none"/>
        <polygon points="3,56 16,52 10,34 2,37" fill="#0055b3"/>
        <path d="M52 48 L88 52 L68 76 L54 74 Z" fill="#08408a"/>
        <ellipse cx="78" cy="58" rx="9" ry="5" fill="#003d82"/>
      </g>
      <!-- Typography: Ym Travel -->
      <text x="68" y="334" font-family="'Brush Script MT', 'Segoe Script', 'Pacifico', cursive" font-size="84" font-weight="bold" font-style="italic" fill="url(#ymBlue)">Ym</text>
      <text x="195" y="334" font-family="'Brush Script MT', 'Segoe Script', 'Pacifico', cursive" font-size="84" font-weight="bold" font-style="italic" fill="url(#travelOrange)">Travel</text>
      <!-- Red Chinese Stamp Seal (汉学) -->
      <g transform="translate(388, 282)">
        <rect x="0" y="0" width="44" height="82" rx="18" fill="#d41400"/>
        <circle cx="6" cy="14" r="2.5" fill="#fff" opacity="0.6"/>
        <circle cx="39" cy="68" r="3" fill="#fff" opacity="0.5"/>
        <text x="22" y="36" text-anchor="middle" font-family="serif" font-size="26" font-weight="bold" fill="#ffffff">汉</text>
        <text x="22" y="68" text-anchor="middle" font-family="serif" font-size="26" font-weight="bold" fill="#ffffff">学</text>
      </g>
      <!-- Subtitles -->
      <text x="245" y="368" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="21" font-weight="800" fill="#174c8f" letter-spacing="5">AND SERVICES</text>
      <line x1="132" y1="394" x2="165" y2="394" stroke="#b81d00" stroke-width="2.5"/>
      <text x="245" y="402" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#b81d00" letter-spacing="3">旅行服务</text>
      <line x1="325" y1="394" x2="358" y2="394" stroke="#b81d00" stroke-width="2.5"/>
      <text x="245" y="436" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="26" font-weight="800" fill="#174c8f" letter-spacing="1">Study in China</text>
    </svg>